<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8bff"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#gloss)"/>
  <!-- screen -->
  <rect x="22" y="30" width="84" height="56" rx="10" fill="#fff"/>
  <!-- stand -->
  <rect x="50" y="92" width="28" height="7" rx="3.5" fill="#fff" fill-opacity=".92"/>
  <!-- record dot with halo -->
  <circle cx="64" cy="58" r="21" fill="#d92d3f" fill-opacity=".16"/>
  <circle cx="64" cy="58" r="13.5" fill="#e5384a"/>
</svg>
